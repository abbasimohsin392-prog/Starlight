name: Deploy Starlight AI to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      confirm_production_deploy:
        description: "Choose DEPLOY to publish the latest main branch to the production Worker named starlight."
        required: true
        type: choice
        options:
          - NO
          - DEPLOY
        default: NO

permissions:
  contents: read

concurrency:
  group: starlight-cloudflare-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.confirm_production_deploy == 'DEPLOY')
    name: Build and deploy to Cloudflare production
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Verify required Cloudflare credentials are configured
        shell: bash
        run: |
          if [[ -z "$CLOUDFLARE_API_TOKEN" ]]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_API_TOKEN. Add it under Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi
          if [[ -z "$CLOUDFLARE_ACCOUNT_ID" ]]; then
            echo "::error::Missing GitHub Actions secret CLOUDFLARE_ACCOUNT_ID. Add it under Settings > Secrets and variables > Actions, then rerun this workflow."
            exit 1
          fi
          echo "Cloudflare credentials are present. Values will not be printed."

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Build and deploy Worker
        run: pnpm deploy
