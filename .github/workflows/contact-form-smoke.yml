name: One-time live contact form delivery test

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/contact-form-smoke.yml"

permissions:
  contents: read

jobs:
  contact-form:
    name: Submit one clearly labeled internal test enquiry
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Playwright in temporary directory
        run: |
          npm install --prefix /tmp/starlight-contact-smoke playwright
          /tmp/starlight-contact-smoke/node_modules/.bin/playwright install --with-deps chromium

      - name: Submit the production contact form once
        run: |
          NODE_PATH=/tmp/starlight-contact-smoke/node_modules node <<'JS'
          const { chromium } = require('playwright');

          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({
              viewport: { width: 390, height: 844 },
              isMobile: true,
              hasTouch: true,
            });

            try {
              const response = await page.goto(
                'https://starlightai.site/contact?source=automated-contact-smoke',
                { waitUntil: 'domcontentloaded', timeout: 30000 }
              );
              if (!response || response.status() !== 200) {
                throw new Error('Contact page did not return HTTP 200.');
              }

              await page.locator('input[name="name"]').fill('Starlight AI Internal QA');
              await page.locator('input[name="email"]').fill('hello@starlightai.site');
              await page.locator('input[name="business"]').fill('Starlight AI Internal QA');
              await page.locator('textarea[name="message"]').fill(
                'INTERNAL AUTOMATED TEST — Please ignore this enquiry. This single production smoke test verifies that the contact form server action can submit through Brevo. Test timestamp: ' + new Date().toISOString()
              );

              await page.getByRole('button', { name: /request my ai system/i }).click();

              const successHeading = page.getByRole('heading', { name: 'You’re on the list.' });
              try {
                await successHeading.waitFor({ state: 'visible', timeout: 30000 });
              } catch {
                const errorText = await page.locator('[role="alert"]').allTextContents().catch(() => []);
                throw new Error(
                  'Contact form did not show success. Visible errors: ' + (errorText.join(' | ') || '(none)')
                );
              }

              console.log('PASS: contact form server action returned success on mobile viewport.');
              console.log('The form is configured to notify hello@starlightai.site through Brevo.');
              console.log('Mailbox delivery still requires checking the recipient inbox.');
            } finally {
              await browser.close();
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          JS
