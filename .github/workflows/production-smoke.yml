name: Production smoke check

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "components/**"
      - "lib/**"
      - "public/**"
      - "wrangler.jsonc"
      - "package.json"
      - "next.config.*"
      - ".github/workflows/production-smoke.yml"

permissions:
  contents: read

jobs:
  production-routes:
    name: Check live production routes
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check public pages, robots, and sitemap
        env:
          SITE_URL: https://starlightai.site
        run: |
          python - <<'PY'
          import concurrent.futures
          import os
          import sys
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          base = os.environ["SITE_URL"].rstrip("/")
          routes = {
              "/": "busywork",
              "/pricing": "pricing built around the workflow",
              "/services": "automation for the work your team repeats",
              "/solutions": "start with a real workflow",
              "/contact": "ready to stop losing leads to voicemail",
              "/privacy": "privacy policy",
              "/terms": "terms of service",
              "/demo/ai-receptionist": "meet your ai receptionist",
              "/demo/real-estate": "see how an ai property assistant could respond",
              "/robots.txt": "sitemap:",
              "/sitemap.xml": "<urlset",
          }

          def check(item):
              path, marker = item
              url = base + path
              req = Request(
                  url,
                  headers={
                      "User-Agent": "Mozilla/5.0 (compatible; StarlightProductionSmoke/1.0)",
                      "Accept": "text/html,application/xml,text/plain,*/*",
                  },
              )
              try:
                  with urlopen(req, timeout=12) as response:
                      status = response.status
                      final_url = response.geturl()
                      body = response.read(2_000_000).decode("utf-8", errors="replace").lower()
                  marker_ok = marker.lower() in body
                  return path, status, final_url, marker_ok, marker, ""
              except HTTPError as exc:
                  return path, exc.code, exc.geturl(), False, marker, "HTTP error"
              except (URLError, TimeoutError, OSError) as exc:
                  return path, 0, url, False, marker, str(exc)[:180]

          last_results = []
          for attempt in range(1, 6):
              with concurrent.futures.ThreadPoolExecutor(max_workers=12) as pool:
                  results = list(pool.map(check, routes.items()))
              failures = [r for r in results if r[1] != 200 or not r[3]]
              last_results = results
              if not failures:
                  print(f"All {len(results)} production route checks passed on attempt {attempt}.")
                  for path, status, final_url, marker_ok, marker, error in results:
                      print(f"PASS {status} {path} -> {final_url}")
                  sys.exit(0)

              print(f"Attempt {attempt}/5: {len(failures)} route check(s) failed.")
              for path, status, final_url, marker_ok, marker, error in failures:
                  reason = error or (f"missing expected page content: {marker!r}" if status == 200 else "unexpected HTTP status")
                  print(f"FAIL {status} {path} -> {final_url}: {reason}")
              if attempt < 5:
                  time.sleep(15)

          print("Production route smoke check failed after retries.")
          sys.exit(1)
          PY

      - name: Exercise the live website-review API
        env:
          SITE_URL: https://starlightai.site
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          endpoint = os.environ["SITE_URL"].rstrip("/") + "/api/website-audit"
          payload = json.dumps({"url": "https://example.com"}).encode("utf-8")
          last_error = "No response received"

          for attempt in range(1, 4):
              request = Request(
                  endpoint,
                  data=payload,
                  method="POST",
                  headers={
                      "Content-Type": "application/json",
                      "Origin": "https://starlightai.site",
                      "User-Agent": "StarlightWebsiteAuditSmoke/1.0",
                  },
              )
              try:
                  with urlopen(request, timeout=45) as response:
                      status = response.status
                      body = response.read(200_000).decode("utf-8", errors="replace")
              except HTTPError as exc:
                  status = exc.code
                  body = exc.read(200_000).decode("utf-8", errors="replace")
              except (URLError, TimeoutError, OSError) as exc:
                  status = 0
                  body = repr(exc)

              if status == 200:
                  try:
                      data = json.loads(body)
                  except json.JSONDecodeError:
                      data = {}
                  if isinstance(data.get("reply"), str) and data["reply"].strip():
                      print(f"PASS live website-review API returned findings on attempt {attempt}.")
                      print(f"Reviewed URL: {data.get('url', '(no URL returned)')}")
                      print(f"Finding length: {len(data['reply'])} characters")
                      sys.exit(0)
                  last_error = f"HTTP 200 but no review reply was returned: {body[:600]}"
              else:
                  try:
                      detail = json.loads(body).get("error", body[:600])
                  except (json.JSONDecodeError, AttributeError):
                      detail = body[:600]
                  last_error = f"HTTP {status}: {detail}"

              print(f"Attempt {attempt}/3 failed: {last_error}")
              if attempt < 3:
                  time.sleep(8)

          print("FAIL live website-review API did not return findings after retries.")
          sys.exit(1)
          PY

      - name: Check international contact links and USD pricing
        run: |
          python - <<'PY'
          from urllib.request import Request, urlopen

          def fetch(path):
              req = Request(
                  "https://starlightai.site" + path,
                  headers={"User-Agent": "Mozilla/5.0 (compatible; StarlightProductionSmoke/1.0)"},
              )
              with urlopen(req, timeout=12) as response:
                  if response.status != 200:
                      raise SystemExit(f"FAIL {path}: HTTP {response.status}")
                  return response.read(2_000_000).decode("utf-8", errors="replace").lower()

          contact = fetch("/contact")
          expected_links = {
              "business email": "mailto:hello@starlightai.site",
              "WhatsApp": "https://wa.me/923007657038",
              "Calendly booking": "https://calendly.com/starlightai306/30min",
          }
          for label, link in expected_links.items():
              if link.lower() not in contact:
                  raise SystemExit(f"FAIL contact page is missing {label} link: {link}")
              print(f"PASS contact page contains {label} link")

          pricing = fetch("/pricing")
          for price in ("$149", "$299", "$499+"):
              if price.lower() not in pricing:
                  raise SystemExit(f"FAIL pricing page is missing USD starting price {price}")
              print(f"PASS pricing page contains {price} starting price")
          PY

      - name: Inspect www canonicalization and email DNS
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request
          from urllib.error import HTTPError

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          print("=== WWW HOST CANONICALIZATION ===")

          def check_www_redirect(path, expected_location):
              url = "https://www.starlightai.site" + path
              req = urllib.request.Request(
                  url,
                  headers={"User-Agent": "Mozilla/5.0 (compatible; StarlightProductionSmoke/1.0)"},
              )
              opener = urllib.request.build_opener(NoRedirect)
              try:
                  with opener.open(req, timeout=12) as response:
                      status = response.status
                      location = response.headers.get("Location", "")
              except HTTPError as exc:
                  status = exc.code
                  location = exc.headers.get("Location", "")
              except Exception as exc:
                  print(f"WARN redirect probe failed for {path}:", repr(exc))
                  return False

              if status in (301, 302, 307, 308) and location == expected_location:
                  print(f"PASS {url} -> {status} {location}")
                  return True

              print(f"FAIL {url} -> status={status}, location={location or '(none)'}; expected redirect to {expected_location}")
              return False

          www_ok = False
          for attempt in range(1, 7):
              root_ok = check_www_redirect("/", "https://starlightai.site/")
              path_ok = check_www_redirect(
                  "/pricing?redirect_smoke=keep-query",
                  "https://starlightai.site/pricing?redirect_smoke=keep-query",
              )
              if root_ok and path_ok:
                  www_ok = True
                  print(f"PASS www canonicalization and path/query preservation on attempt {attempt}")
                  break
              if attempt < 6:
                  time.sleep(15)

          if not www_ok:
              print("FAIL www must redirect the homepage and preserve non-root paths and query strings.")

          def dns_query(name, rtype):
              query = urllib.parse.urlencode({"name": name, "type": rtype})
              url = "https://dns.google/resolve?" + query
              with urllib.request.urlopen(url, timeout=12) as response:
                  return json.load(response)

          def records(name, rtype):
              try:
                  data = dns_query(name, rtype)
                  answer = data.get("Answer", [])
                  return [item.get("data", "") for item in answer], data.get("Status", 0)
              except Exception as exc:
                  print(f"WARN DNS lookup failed for {name} {rtype}:", repr(exc))
                  return [], None

          print("=== MAIL DNS AUTHENTICATION ===")
          txt, txt_status = records("starlightai.site", "TXT")
          spf = [x for x in txt if x.lower().startswith('"v=spf1') or x.lower().startswith("v=spf1")]
          print("SPF records:", spf or "(none found)")
          if len(spf) == 1:
              print("PASS one SPF record found")
          else:
              print("WARN expected one SPF record; found", len(spf))

          dmarc, dmarc_status = records("_dmarc.starlightai.site", "TXT")
          dmarc_records = [x for x in dmarc if "v=dmarc1" in x.lower()]
          print("DMARC records:", dmarc_records or "(none found)")
          if len(dmarc_records) == 1:
              print("PASS one DMARC record found")
          else:
              print("WARN expected one DMARC record; found", len(dmarc_records))

          mx, mx_status = records("starlightai.site", "MX")
          print("MX records:", mx or "(none found)")
          if mx:
              print("PASS inbound email MX record(s) found")
          else:
              print("WARN no MX records found; verify how hello@starlightai.site receives email")

          brevo_code = [x for x in txt if "brevo-code:" in x.lower()]
          print("Brevo domain-verification code records:", brevo_code or "(none found in root TXT records)")

          for selector in ("brevo1", "brevo2", "sib1", "sib2", "sib3", "mail", "default", "selector1", "google"):
              for rtype in ("CNAME", "TXT"):
                  answers, status = records(f"{selector}._domainkey.starlightai.site", rtype)
                  if answers:
                      print(f"DKIM candidate {selector} ({rtype}):", answers)
          print("DNS diagnostic complete. Confirm DKIM selectors with Brevo before changing DNS.")
          if not www_ok:
              raise SystemExit(1)
          PY
